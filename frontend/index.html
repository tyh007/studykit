<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#FBF6EE" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1C1216" media="(prefers-color-scheme: dark)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="StudyKit — Lecture slides, notes, literature, and AI revision in one workspace." />
    <meta property="og:title" content="StudyKit" />
    <meta property="og:description" content="The academic learning operating system." />
    <meta property="og:type" content="website" />
    <title>StudyKit</title>
    <script>
      // v0.4 Theme bootstrap — runs before React mounts so the page never
      // paints in the wrong theme. Source of truth lives in
      // src/shared/theme/bootstrapScript.ts; this block is a hand-synced
      // copy. Keep the two in lockstep.
      (function () {
        try {
          var KEY = 'studykit.theme';
          var stored = null;
          try { stored = window.localStorage.getItem(KEY); } catch (e) { stored = null; }
          var pref = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          var resolved = pref === 'system'
            ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : pref;
          var root = document.documentElement;
          root.setAttribute('data-theme', resolved);
        } catch (e) {
          // Last-resort: leave data-theme unset so the @media system fallback applies.
        }
      })();
    </script>
  </head>
  <body>
    <script>
      // Runtime env vars (injected by Render/Fly.io deployment)
      window.__ENV = window.__ENV || {};
      window.__ENV.VITE_API_URL = window.__ENV.VITE_API_URL || '';
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
