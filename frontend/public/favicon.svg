<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="StudyKit">
  <defs>
    <style>
      :root { color: #3A2E2E; }
      @media (prefers-color-scheme: dark) { :root { color: #E8DFD8; } }
    </style>
    <linearGradient id="prism-light" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5E5BE"/>
      <stop offset="0.33" stop-color="#F2D5D2"/>
      <stop offset="0.66" stop-color="#E5B8B0"/>
      <stop offset="1" stop-color="#DCC8DC"/>
    </linearGradient>
    <linearGradient id="prism-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D8B884"/>
      <stop offset="0.33" stop-color="#C49898"/>
      <stop offset="0.66" stop-color="#A87474"/>
      <stop offset="1" stop-color="#9C7CA8"/>
    </linearGradient>
  </defs>
  <!-- The "S" — single ink stroke; color follows CSS color via currentColor. -->
  <path
    d="M 23 6 H 11 a 5 5 0 0 0 0 10 H 21 a 5 5 0 0 1 0 10 H 9"
    fill="none"
    stroke="currentColor"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <!-- Light-mode prism highlight at the central bend. -->
  <line
    x1="13"
    y1="16"
    x2="19"
    y2="16"
    stroke="url(#prism-light)"
    stroke-width="4.5"
    stroke-linecap="round"
    class="prism-light"
  />
  <!-- Dark-mode prism highlight; hidden in light mode, shown in dark mode. -->
  <line
    x1="13"
    y1="16"
    x2="19"
    y2="16"
    stroke="url(#prism-dark)"
    stroke-width="4.5"
    stroke-linecap="round"
    class="prism-dark"
  />
  <style>
    .prism-dark { display: none; }
    @media (prefers-color-scheme: dark) {
      .prism-light { display: none; }
      .prism-dark { display: inline; }
    }
  </style>
</svg>
