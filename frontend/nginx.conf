server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase max upload size for PDF files (100MB)
    client_max_body_size 100M;

    # Gzip compression for faster load times
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
    gzip_vary on;

    # ===== Security Headers =====

    # Prevent clickjacking
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;

    # Enable XSS filter in older browsers
    add_header X-XSS-Protection "1; mode=block" always;

    # Referrer policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTTP Strict Transport Security (HSTS)
    # Uncomment when HTTPS is configured:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Content Security Policy (CSP)
    #
    # connect-src threat model:
    #   * http://127.0.0.1:8000  — local backend (also reachable via /api/)
    #   * http://127.0.0.1:11434 — Ollama (local LLM)
    #   * http://127.0.0.1:1234  — LM Studio / MLX (local LLM)
    # These loopback-only allowances let the browser talk to local LLMs
    # directly. The threat model is "loopback is local-user territory":
    # anyone able to MITM a loopback connection already has shell on the
    # user's machine. We use 127.0.0.1 (not bare "localhost") to avoid
    # surprise when /etc/hosts is altered. Do NOT add remote origins
    # here — all remote traffic MUST go through /api/, which is proxied
    # to the authenticated backend.
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:;
        style-src 'self' 'unsafe-inline' blob:;
        img-src 'self' data: blob:;
        font-src 'self' data:;
        connect-src 'self' https: http://127.0.0.1:8000 http://127.0.0.1:11434 http://127.0.0.1:1234;
        worker-src 'self' blob:;
        frame-src 'self';
        object-src 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    # Permissions Policy (restrict browser features)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    # Ensure .mjs files are served with correct JavaScript MIME type
    # (required for PDF.js ES module worker)
    include /etc/nginx/mime.types;
    types {
        application/javascript mjs;
    }

    # Cache static assets (JS/CSS with content hash in filename)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (backend has 180s, so nginx must allow at least that long)
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # Uploads proxy
    location /uploads/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Cache uploaded PDFs for 1 hour
        expires 1h;
        add_header Cache-Control "public";
    }

    # Exports proxy
    location /exports/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        # Don't cache export files (they may expire)
        expires -1;
        add_header Cache-Control "no-store";
    }

    # SPA fallback — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }
}
