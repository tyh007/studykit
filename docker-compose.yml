services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studykit
      POSTGRES_USER: studykit
      POSTGRES_PASSWORD: ${DB_PASSWORD:-studykit_dev_pass}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studykit"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: studykit
      DB_USER: studykit
      DB_PASSWORD: ${DB_PASSWORD:-studykit_dev_pass}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      UPLOAD_DIR: /data/uploads
      EXPORT_DIR: /data/exports
    volumes:
      - upload_data:/data/uploads
      - export_data:/data/exports
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  db_data:
    # 本地运行：使用 Docker 自动管理的命名卷
    # NAS 部署：设置环境变量 NAS_DATA_DIR 来绑定到固定路径
    # 例如: NAS_DATA_DIR=/volume1/docker/studykit docker compose up -d
  upload_data:
  export_data:
